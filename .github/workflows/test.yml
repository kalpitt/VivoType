name: CI

# Budget note (private repo => GitHub-hosted minutes bill against the free
# monthly quota; macOS runners cost ~10x a Linux minute):
#   - docs/context-only pushes skip CI entirely (paths-ignore below)
#   - the expensive macOS build runs only where it matters: PRs to main and
#     manual dispatches — ordinary branch pushes get the Linux matrix only.
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'context/**'
      - 'branding/**'
      - 'homebrew/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'context/**'
      - 'branding/**'
      - 'homebrew/**'
      - '**.md'
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two versions cover the contract: 3.9 is the minimum core/ must
        # support (core/CLAUDE.md); 3.11 is the version the runtime venv
        # actually uses (setup_core.sh). Linux minutes are cheap enough to
        # gate every push.
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # NOTE: we deliberately do NOT install -r requirements.txt here. The ASR
        # backend now uses mlx-whisper (Apple Silicon / mlx-metal only), which has
        # no Linux wheel. The stdlib-unittest suite never imports it — transcription
        # is always mocked and mlx/huggingface imports are lazy — so numpy is the
        # only third-party dependency the tests actually need.
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24"

      - name: Run core tests
        run: python -m unittest discover -s core/tests -t . -v

  swift-build:
    name: macOS build (Swift)
    runs-on: macos-latest
    # macOS runners bill ~10x Linux minutes against the free quota, so this
    # job runs only where a broken build can actually merge or ship: PRs,
    # main itself, and manual dispatches. Feature-branch pushes are covered by
    # the Python matrix; their final PR check builds for real.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode CLI tools
        run: swiftc --version

      - name: Build VivoType.app
        # Run the real packaging script so CI catches Swift syntax/API
        # regressions across all modules AND build-script regressions. The
        # script compiles every clients/mac/*.swift file as one module (no Xcode
        # project — see ADR-0005) and ad-hoc signs the bundle.
        run: ./clients/mac/build_app.sh

      - name: Verify the app binary was produced
        run: test -x clients/mac/build/VivoType.app/Contents/MacOS/VivoType
